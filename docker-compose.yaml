# Local stack. Secrets are Docker secrets read from files in ./secrets/ (git-ignored);
# create them once with: infra/init-secrets.sh
# Everything else the app needs is configured by the admin in the web app.
#
# Only non-secret wiring (hostnames, ports, names) is written here.

name: adaptive-music

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  app_encryption_keys:
    file: ./secrets/app_encryption_keys
  seaweedfs_s3_config:
    file: ./secrets/seaweedfs_s3_config.json

services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: music
      POSTGRES_DB: music
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"   # override if 5432 is taken
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U music -d music"]
      interval: 5s
      timeout: 3s
      retries: 10

  seaweedfs:
    image: chrislusf/seaweedfs:4.53
    command: >
      server -dir=/data -ip=seaweedfs -ip.bind=0.0.0.0
      -volume.max=0 -s3 -s3.port=8333 -s3.config=/run/secrets/seaweedfs_s3_config
    secrets: [seaweedfs_s3_config]
    volumes:
      - seaweedfs-data:/data
    ports:
      - "127.0.0.1:${S3_HOST_PORT:-8333}:8333"         # S3 API; override if taken

  # api:
  #   build: ./apps/api
  #   environment:
  #     DATABASE_HOST: postgres
  #     DATABASE_PORT: "5432"
  #     DATABASE_USER: music
  #     DATABASE_NAME: music
  #   secrets: [postgres_password, app_encryption_keys]
  #   depends_on:
  #     postgres: { condition: service_healthy }
  #     seaweedfs: { condition: service_started }
  #   ports: ["127.0.0.1:8000:8000"]
  #
  # worker:   same image and secrets as api, command: worker
  # web:      build: ./apps/web, environment: API_BASE_URL: http://api:8000

volumes:
  postgres-data:
  seaweedfs-data:
