[project]
name = "demo"
version = "0.1.0"
description = "One-page demo of the adaptive background music pipeline."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.165.0",
    "openai>=3.60.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.34",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF"]

[dependency-groups]
dev = [
    "ruff>=0.17.6",
]
